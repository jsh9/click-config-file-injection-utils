[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=63"]

[project]
name = "click-config-file-injection-utils"
version = "0.1.1"
dependencies = [
  "click>=8.1",
]
requires-python = ">=3.10"
authors = [
  {name = "jsh9"},
]
description = "Click callback for injecting option defaults from TOML files"
keywords = ["cli", "click", "config", "toml"]
license = {file = "LICENSE"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/jsh9/click-config-file-injection-utils"
Repository = "https://github.com/jsh9/click-config-file-injection-utils"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["click_config_file_injection_utils"]

[tool.setuptools.package-data]
"click_config_file_injection_utils" = ["py.typed"]
